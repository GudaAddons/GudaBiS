# Packages the addon and uploads it to Wago Addons (X-Wago-ID in the TOC) on every
# pushed tag. Needs the WAGO_API_TOKEN secret; CurseForge keeps its own webhook.
# Both build a GudaBiS/ folder from .pkgmeta; never upload GitHub's source zip
# (its GudaBiS-<tag>/ folder does not match the TOC names and is rejected).
name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and upload to Wago
        uses: BigWigsMods/packager@v2
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
